<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sarp's ADS-B Radar</title>

<link rel="nk
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
}

#map {
    width: 100%;
    height: 100vh;
}

.info {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 9999;

    background: rgba(20,20,20,0.9);
    color: #00ff66;

    padding: 15px;
    border-radius: 10px;

    font-family: monospace;
    min-width: 220px;

    border: 1px solid #005500;
}

hr {
    border: none;
    height: 1px;
    background: #004400;
}
</style>
</head>

<body>

<div class="info">
    <b>📡 Sarp's ADS-B Radar</b>
    <hr>
    <div id="stats">Loading...</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Haritayı başlat
const map = L.map('map').setView([39.93, 32.85], 7);

// Gerçek harita katmanı
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

const aircraftLayer = L.layerGroup().addTo(map);

function loadAircraft() {

    fetch('../data/aircraft.json')
    .then(response => response.json())
    .then(data => {

        aircraftLayer.clearLayers();

        if (!data.aircraft) {
            return;
        }

        let total = 0;

        data.aircraft.forEach(ac => {

            const callsign = (ac.flight || '').trim();

            const lat = ac.lat;
            const lon = ac.lon;

            if (lat == null || lon == null) {
                return;
            }

            total++;

            const heading = ac.track || 0;

            const planeIcon = L.divIcon({
                html:
                    "<div style='font-size:30px;color:red;" +
                    "transform:rotate(" + heading + "deg);'>" +
                    "✈</div>",
                className: '',
                iconSize: [30,30],
                iconAnchor: [15,15]
            });

            L.marker([lat, lon], {
                icon: planeIcon
            })
            .bindPopup(
                "<b>" + callsign + "</b><br>" +
                "Altitude: " + (ac.alt_baro || "-") + " ft<br>" +
                "Speed: " + (ac.gs || "-")
            )
            .addTo(aircraftLayer);

        });

        document.getElementById('stats').innerHTML =
            "✈ Traffic : " + total;
    })
    .catch(error => {
        console.error(error);
    });

}

loadAircraft();
setInterval(loadAircraft, 5000);

</script>

</body>
</html>
